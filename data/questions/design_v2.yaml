# Design spec for the v2 question set (see docs/DECISIONS.md D-030).
#
# The set is a STRATIFIED DESIGN, not a random sample:
#
#   sense cells (cap = 3, so positions 1-3 are visible):
#     S1_shallow_cued    gold in the first 3, a distinctive cue is present
#                        -> all methods should work (calibration)
#     S2_shallow_nocue   gold in the first 3, no dictionary cue
#                        -> C wins by position; B may fail (decoy context)
#     S3_buried_cued     gold OUTSIDE the first 3, a distinctive cue is present
#                        -> C must fail, D must win (the payoff cell)
#     S4_buried_nocue    gold outside the first 3, no cue
#                        -> C and D both fail (the rule's boundary)
#
#   relation cells:
#     R_<relation>_overlap   the related sense's definition overlaps the gold's
#                            -> C can solve it without the graph
#     R_<relation>_disjoint  the definitions share nothing
#                            -> only the explicit link (D) can solve it
#
# The cell is NOT hand-written: scripts/build_questions_v2.py derives it from the
# dictionary (position, cue hits vs. the gold sense's neighbourhood) and refuses
# to write a question whose measured cell differs from `expect_cell`.
#
# `phenomena` are extra tags for subgroup analysis (figurative, decoy,
# low_polysemy, multiword).

reuse:
  # existing, already-used questions whose design cell is derived here
  - id: q-001
  - id: q-002
  - id: q-003
  - id: q-011
    phenomena: [figurative]
  - id: q-019
    phenomena: [figurative]
  - id: q-024
  - id: q-025
    phenomena: [figurative, multiword]
  - id: q-026
    phenomena: [figurative]
  - id: q-029
    phenomena: [figurative]
  - id: q-030
    phenomena: [figurative]
  - id: q-031
  - id: q-032
  - id: q-033
  - id: q-034
  - id: q-035
  - id: q-036

