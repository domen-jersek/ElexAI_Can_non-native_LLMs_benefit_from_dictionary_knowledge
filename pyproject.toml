[project]
name = "elexai"
version = "0.1.0"
description = "ELEXAI pilot: comparing a base LLM, text RAG and graph RAG over Slovene lexicographic data (DDDS/WordNet)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "sentence-transformers>=6.1.0",
    "faiss-cpu>=1.15.1",
    "neo4j>=6.4.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
    "pandas>=3.0.6",
    "matplotlib>=3.11.2",
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pandas-stubs>=3.0.5.260914",
    "numpy>=2.5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elexai"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
