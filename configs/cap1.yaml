# cap1 experiment: identical to skeleton.yaml, except that only the FIRST
# candidate is shown to the model (see configs/cap3.yaml for the rationale).
# This is the harshest truncation regime: C shows the dictionary-first sense,
# D the graph-top sense (evidence-bearing candidate first for relations).
name: cap1
description: >
  Sense-disambiguation + relation pilot over DDDS (backup v3.68) with a
  CANDIDATE CAP of 1: variant C shows the first sense of the lemma in
  dictionary order, variant D the top sense by graph neighborhood match (graph
  evidence first for relation questions), oracle keeps gold + neighbours.
  Questions are DRAFT until a lexicographer verifies them.
variants: [A, B, C, D, oracle]
questions_path: data/questions/questions.jsonl
llm:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model: openai/gpt-6-luna # identical across variants; change only via config
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.0
  max_tokens: 800
embedder:
  name: bge-m3
  hf_id: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181 # pinned commit
  batch_size: 16
  normalize: true
retrieval:
  k: 3 #5
  sweep_k: [1, 3, 5, 10]
  metric: cosine
structured:
  max_senses: 1
  synonyms_per_sense: 5
  max_dependencies: 8
  oracle_max_candidates: 5
graph:
  # Neo4j (Neo4j Desktop default bolt://localhost:7687; credentials in .env)
  uri_env: NEO4J_URI
  user_env: NEO4J_USER
  password_env: NEO4J_PASSWORD
  max_candidates: 1 # same cap as structured.max_senses (fair C-vs-D comparison)
  synonyms_shown: 5
  collocations_shown: 8
  weight_definition: 1.0
  weight_collocation: 2.0
  weight_synonym: 2.0
eval:
  answer_f1_threshold: 0.6
seed: 0
