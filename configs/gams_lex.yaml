# Local run: GaMS3-12B-Instruct-Lex (Gemma 3 12B, continually pretrained on
# DDD + WSD + sloWNet) served as a Q4_K_M GGUF by llama-server on this machine.
#
# Full recipe (download -> convert -> quantize -> serve) and the caveats:
# docs/LOCAL_MODEL.md. Start the server first, then run the pipeline:
#
#   llama-server -m models/lex-q4_k_m.gguf -c 8192 -t 4 --jinja --port 8080
#   uv run python -m elexai.runner configs/gams_lex.yaml --limit 3   # sanity
#   uv run python -m elexai.runner configs/gams_lex.yaml             # overnight
#
# This is a *quantized local* run. Pair it with configs/gams_instruct_q4.yaml
# (the plain Instruct model at the SAME quantization) so the Lex effect can be
# separated from the quantization effect. Questions, retrieval and graph
# settings are identical to configs/skeleton.yaml - the contexts are the same
# as in the API / povejmo.si runs.
name: gams-lex
description: >
  GaMS3-12B-Instruct-Lex (Q4_K_M GGUF, local llama-server) on the same 36
  questions and variants as the API and povejmo.si runs: "dictionary in the
  weights vs in the context". Quantized local run - see docs/LOCAL_MODEL.md.
variants: [A, B, C, D, oracle]
questions_path: data/questions/questions.jsonl
llm:
  provider: llama.cpp
  base_url: http://127.0.0.1:8080/v1
  model: gams3-12b-instruct-lex-q4_k_m
  api_key_env: LOCAL_LLM_KEY # any non-empty value; put LOCAL_LLM_KEY=local in .env
  temperature: 0.0
  seed: 0
  max_tokens: 800
  timeout_s: 900 # CPU inference: a long prompt can take minutes
embedder:
  name: bge-m3
  hf_id: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181 # pinned commit
  batch_size: 16
  normalize: true
retrieval:
  k: 3
  sweep_k: [1, 3, 5, 10]
  metric: cosine
structured:
  max_senses: 12
  synonyms_per_sense: 5
  max_dependencies: 8
  oracle_max_candidates: 5
graph:
  # Neo4j (Neo4j Desktop default bolt://localhost:7687; credentials in .env)
  uri_env: NEO4J_URI
  user_env: NEO4J_USER
  password_env: NEO4J_PASSWORD
  max_candidates: 12
  synonyms_shown: 5
  collocations_shown: 8
  weight_definition: 1.0
  weight_collocation: 2.0
  weight_synonym: 2.0
eval:
  answer_f1_threshold: 0.6
seed: 0
