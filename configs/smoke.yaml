# Fast smoke configuration: tiny embedder + a slice of the corpus.
# Use it to validate the whole pipeline in minutes before the real run
# (recall/accuracy numbers from smoke runs are NOT meaningful - smaller corpus).
name: smoke
description: >
  Pipeline smoke test: multilingual-e5-small, only the first 20k sense chunks.
  Same questions and LLM as the real pilot; for plumbing checks only.
variants: [A, B, C, oracle]
questions_path: data/questions/questions.jsonl
llm:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model: openai/gpt-6-luna
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.0
  max_tokens: 800
embedder:
  name: e5-small
  hf_id: intfloat/multilingual-e5-small
  revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3   # pinned commit
  query_prefix: "query: "
  passage_prefix: "passage: "
  batch_size: 32
  normalize: true
retrieval:
  k: 5
  sweep_k: [1, 3, 5, 10]
  metric: cosine
  corpus_limit: 20000
structured:
  max_senses: 12
  synonyms_per_sense: 5
  oracle_max_candidates: 5
eval:
  answer_f1_threshold: 0.6
seed: 0
