# Gemini run: the same 36 questions and variants as configs/skeleton.yaml,
# only the model changes (Klemen's request: Gemini is reportedly stronger in
# languages). Same prompts/contexts as every other run, so the comparison is 1:1.
name: gemini4-argon
description: >
  Sense-disambiguation pilot over DDDS with Google's Gemini 4 Argon
  (openrouter) instead of the base API model: A (base LLM), B (text RAG,
  BGE-M3 exact FAISS), C (structured lookup), D (graph RAG), oracle.
  Questions are DRAFT until a lexicographer verifies them.
variants: [A, B, C, D, oracle]
questions_path: data/questions/questions.jsonl
llm:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model: google/gemini-4-argon # identical across variants; change only via config
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.0
  max_tokens: 2000 # headroom in case the model spends tokens on reasoning
embedder:
  name: bge-m3
  hf_id: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181 # pinned commit (same as skeleton)
  batch_size: 16
  normalize: true
retrieval:
  k: 3
  sweep_k: [1, 3, 5, 10]
  metric: cosine
structured:
  max_senses: 12
  synonyms_per_sense: 5
  max_dependencies: 8
  oracle_max_candidates: 5
graph:
  # Neo4j (Neo4j Desktop default bolt://localhost:7687; credentials in .env)
  uri_env: NEO4J_URI
  user_env: NEO4J_USER
  password_env: NEO4J_PASSWORD
  max_candidates: 12
  synonyms_shown: 5
  collocations_shown: 8
  weight_definition: 1.0
  weight_collocation: 2.0
  weight_synonym: 2.0
eval:
  answer_f1_threshold: 0.6
seed: 0
