# cap3 experiment: identical to skeleton.yaml, except that only the FIRST 3
# candidates are shown to the model. This is the regime where candidate ORDER
# matters - with all candidates visible (skeleton.yaml), C and D both saturate
# (see runs/20261022-091557_skeleton).
#
#   C: first 3 senses of the lemma in dictionary order;
#   D: top 3 by graph neighborhood match (evidence-bearing candidates first
#      for relation questions);
#   oracle: unchanged ceiling (gold + neighbours, cap 5).
#
# Everything else (model, embedder, k=3 retrieval, questions) is unchanged.
name: cap3
description: >
  Sense-disambiguation + relation pilot over DDDS (backup v3.68) with a
  CANDIDATE CAP of 3: variant C shows the first 3 senses of the lemma in
  dictionary order, variant D the top 3 by graph neighborhood match (graph
  evidence first for relation questions), oracle keeps gold + neighbours.
  Questions are DRAFT until a lexicographer verifies them.
variants: [A, B, C, D, oracle]
questions_path: data/questions/questions.jsonl
llm:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model: openai/gpt-6-luna # identical across variants; change only via config
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.0
  max_tokens: 800
embedder:
  name: bge-m3
  hf_id: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181 # pinned commit
  batch_size: 16
  normalize: true
retrieval:
  k: 3 #5
  sweep_k: [1, 3, 5, 10]
  metric: cosine
structured:
  max_senses: 3
  synonyms_per_sense: 5
  max_dependencies: 8
  oracle_max_candidates: 5
graph:
  # Neo4j (Neo4j Desktop default bolt://localhost:7687; credentials in .env)
  uri_env: NEO4J_URI
  user_env: NEO4J_USER
  password_env: NEO4J_PASSWORD
  max_candidates: 3 # same cap as structured.max_senses (fair C-vs-D comparison)
  synonyms_shown: 5
  collocations_shown: 8
  weight_definition: 1.0
  weight_collocation: 2.0
  weight_synonym: 2.0
eval:
  answer_f1_threshold: 0.6
seed: 0
