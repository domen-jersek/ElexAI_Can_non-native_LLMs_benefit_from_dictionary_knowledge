# The main pilot configuration: run this after building the index.
#
# Everything is pinned: model id, embedder revision, retrieval depth, prompt
# template version is recorded per run. See docs/RUN_PILOT.md for the workflow.
name: skeleton
description: >
  Sense-disambiguation pilot over DDDS (backup v3.68): variant A (base LLM),
  B (text RAG, BGE-M3 exact FAISS over sense chunks), C (structured lookup:
  lemma senses + collocations/synonyms), oracle (gold + neighbours).
  Questions are DRAFT until a lexicographer verifies them.
variants: [A, B, C, oracle]
questions_path: data/questions/questions.jsonl
llm:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model: openai/gpt-6-luna     # identical across variants; change only via config
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.0
  max_tokens: 800
embedder:
  name: bge-m3
  hf_id: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181   # pinned commit
  batch_size: 16
  normalize: true
retrieval:
  k: 5
  sweep_k: [1, 3, 5, 10]
  metric: cosine
structured:
  max_senses: 12
  synonyms_per_sense: 5
  oracle_max_candidates: 5
eval:
  answer_f1_threshold: 0.6
seed: 0
